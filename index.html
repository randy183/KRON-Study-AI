        button,

        button {
            cursor: pointer;

        /* =========================
           HEADER
        ========================= */

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow:
                0 4px 15px rgba(37, 99, 235, 0.18);
        }

        .header-inner {
            width: 100%;
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            opacity: 0.85;
        }

        /* =========================
           NAVIGATION
        ========================= */

        nav {
            width: 100%;
            max-width: 1200px;
            margin: auto;

            display: flex;
            gap: 8px;

            overflow-x: auto;
            padding-top: 15px;

            scrollbar-width: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav button {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;

            padding: 10px 15px;
            border-radius: 10px;

            white-space: nowrap;
            transition: 0.2s;
        }

        nav button:hover,
        nav button.active {
            background: white;
            color: #2563eb;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 1200px;
            margin: auto;

            padding: 30px 20px 60px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            border-radius: 22px;
            padding: 40px;

            margin-bottom: 25px;

            box-shadow:
                0 12px 30px rgba(37,99,235,0.18);
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 17px;
            line-height: 1.7;
            max-width: 750px;
        }

        /* =========================
           CARDS
        ========================= */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;

            border-radius: 18px;
            padding: 24px;

            box-shadow:
                0 5px 20px rgba(15,23,42,0.07);

            border: 1px solid #e7edf7;
        }

        .card h2,
        .card h3 {
            margin-bottom: 10px;
            color: #172033;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
        }

        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            margin-bottom: 20px;
        }

        .section-title h2 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .section-title p {
            color: #64748b;

        /* =========================
           FORM ELEMENTS
        ========================= */

        label {

            font-weight: 700;
            margin-bottom: 8px;

        input,

            background: white;

        input:focus,

        textarea {

        /* =========================

        }

        .secondary {

            font-weight: 700;

    <script>

        /* =========================
           API
        ========================= */

        const API_URL =
            "https://eclectic-gaufre-e909ee.netlify.app/api/search";


        /* =========================
           APP DATA
        ========================= */

        let currentQuiz = [];

        let selectedAnswers = [];

        let chatHistory =
            JSON.parse(
                localStorage.getItem(
                    "KRON_LAST_10_CHATS"
                ) || "[]"
            );

        let notes =
            JSON.parse(
                localStorage.getItem(
                    "KRON_NOTES"
                ) || "[]"
            );

        let plannerTasks =
            JSON.parse(
                localStorage.getItem(
                    "KRON_PLANNER"
                ) || "[]"
            );

        let progressData =
            JSON.parse(
                localStorage.getItem(
                    "KRON_PROGRESS"
                ) ||
                '{"quizzes":0,"questions":0,"score":0}'
            );


        /* =========================
           PAGE NAVIGATION
        ========================= */

        function showPage(pageId) {

            document
                .querySelectorAll(".page")
                .forEach(function(page) {

                    page.classList.remove("active");

                });


            const page =
                document.getElementById(pageId);


            if (page) {

                page.classList.add("active");

            }


            document
                .querySelectorAll("nav button")
                .forEach(function(button) {

                    button.classList.remove("active");

                });


            document
                .querySelectorAll("nav button")
                .forEach(function(button) {

                    const action =
                        button.getAttribute(
                            "onclick"
                        );

                    if (
                        action &&
                        action.includes(
                            "'" + pageId + "'"
                        )
                    ) {

                        button.classList.add(
                            "active"
                        );

                    }

                });


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            if (pageId === "notes") {

                renderNotes();

            }


            if (pageId === "planner") {

                renderPlanner();

            }


            if (pageId === "progress") {

                renderProgress();

            }


            if (pageId === "chats") {

                renderChatHistory();

            }

        }


        /* =========================
           HTML SAFETY
        ========================= */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           CHAT STORAGE
        ========================= */

        function saveChat(
            type,
            question,
            answer
        ) {

            chatHistory.unshift({

                type: type,

                question: question,

                answer: answer,

                date:
                    new Date()
                    .toLocaleString()

            });


            chatHistory =
                chatHistory.slice(0, 10);


            localStorage.setItem(
                "KRON_LAST_10_CHATS",
                JSON.stringify(chatHistory)
            );


            renderChatHistory();

        }


        function renderChatHistory() {

            const box =
                document.getElementById(
                    "chatHistory"
                );


            if (!box) {

                return;

            }


            if (!chatHistory.length) {

                box.innerHTML = `
                    <div class="card">
                        <h3>No saved chats yet</h3>

                        <p>
                            Your last 10 AI conversations
                            will appear here.
                        </p>
                    </div>
                `;

                return;

            }


            box.innerHTML =
                chatHistory
                    .map(function(chat) {

                        return `
                            <div
                                class="card"
                                style="margin-bottom:15px;">

                                <h3>
                                    ${escapeHTML(
                                        chat.type
                                    )}
                                </h3>

                                <p>
                                    <strong>
                                        Question:
                                    </strong>
                                    ${escapeHTML(
                                        chat.question
                                    )}
                                </p>

                                <p
                                    style="margin-top:10px;">
                                    <strong>
                                        Answer:
                                    </strong>
                                    ${escapeHTML(
                                        chat.answer
                                    )}
                                </p>

                                <p
                                    style="
                                        margin-top:10px;
                                        font-size:13px;
                                    ">

                                    ${escapeHTML(
                                        chat.date
                                    )}

                                </p>

                            </div>
                        `;

                    })
                    .join("");

        }


        function clearChats() {

            if (
                !confirm(
                    "Clear all saved chats?"
                )
            ) {

                return;

            }


            chatHistory = [];


            localStorage.removeItem(
                "KRON_LAST_10_CHATS"
            );


            renderChatHistory();

        }


        /* =========================
           WAEC AI
        ========================= */

        async function askWAEC() {

            const subject =
                document.getElementById(
                    "waecSubject"
                ).value;


            const question =
                document.getElementById(
                    "waecQuestion"
                ).value.trim();


            const answerBox =
                document.getElementById(
                    "waecAnswer"
                );


            if (!question) {

                answerBox.innerHTML = `
                    <div class="card">
                        Please enter a question first.
                    </div>
                `;

                return;

            }


            answerBox.innerHTML = `
                <div class="card">
                    <p>
                        KRON is thinking...
                    </p>
                </div>
            `;


            try {

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    mode: "waec",

                                    subject: subject,

                                    question: question

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Request failed."
                    );

                }


                const answer =
                    data.answer ||
                    "No answer was returned.";


                answerBox.innerHTML = `
                    <div class="card">

                        <h3>
                            KRON's Answer
                        </h3>

                        <p
                            style="
                                margin-top:12px;
                                white-space:pre-wrap;
                            ">

                            ${escapeHTML(
                                answer
                            )}

                        </p>

                    </div>
                `;


                saveChat(
                    "WAEC AI",
                    subject +
                    ": " +
                    question,
                    answer
                );


            } catch (error) {

                answerBox.innerHTML = `
                    <div class="card">

                        <h3>
                            Something went wrong
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>
                `;

            }

        }


        /* =========================
           WEB SEARCH
        ========================= */

        async function searchWeb() {

            const question =
                document.getElementById(
                    "webQuestion"
                ).value.trim();


            const resultsBox =
                document.getElementById(
                    "webResults"
                );


            if (!question) {

                resultsBox.innerHTML = `
                    <div class="card">
                        Enter something to search.
                    </div>
                `;

                return;

            }


            resultsBox.innerHTML = `
                <div class="card">
                    <p>
                        Searching...
                    </p>
                </div>
            `;


            try {

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    mode: "web",

                                    subject: "",

                                    question: question

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Search failed."
                    );

                }


                const answer =
                    data.answer ||
                    "No result was returned.";


                resultsBox.innerHTML = `
                    <div class="card">

                        <h3>
                            Search Result
                        </h3>

                        <p
                            style="
                                margin-top:12px;
                                white-space:pre-wrap;
                            ">

                            ${escapeHTML(
                                answer
                            )}

                        </p>

                    </div>
                `;


                saveChat(
                    "Web Search",
                    question,
                    answer
                );


            } catch (error) {

                resultsBox.innerHTML = `
                    <div class="card">

                        <h3>
                            Something went wrong
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>
                `;

            }

        }


        /* =========================
           QUIZ GENERATOR
        ========================= */

        async function generateQuiz() {

            const subject =
                document.getElementById(
                    "quizSubject"
                ).value;


            const quizBox =
                document.getElementById(
                    "quizContainer"
                );


            quizBox.innerHTML = `
                <div class="card">
                    <p>
                        Generating your quiz...
                    </p>
                </div>
            `;


            try {

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    mode: "quiz",

                                    subject: subject,

                                    question:
                                        "Create 5 WAEC-style multiple choice questions for " +
                                        subject +
                                        ". Include 4 options, the correct answer index, and a short explanation."

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Quiz generation failed."
                    );

                }


                if (
                    !data.quiz ||
                    !Array.isArray(
                        data.quiz.questions
                    )
                ) {

                    throw new Error(
                        "Invalid quiz returned."
                    );

                }


                currentQuiz =
                    data.quiz.questions;


                selectedAnswers =
                    new Array(
                        currentQuiz.length
                    ).fill(null);


                renderQuiz();


            } catch (error) {

                quizBox.innerHTML = `
                    <div class="card">

                        <h3>
                            Quiz Error
                        </h3>

                        <p>
                            ${escapeHTML(
                                error.message
                            )}
                        </p>

                    </div>
                `;

            }

        }


        /* =========================
           RENDER QUIZ
        ========================= */

        function renderQuiz() {

            const quizBox =
                document.getElementById(
                    "quizContainer"
                );


            if (!currentQuiz.length) {

                quizBox.innerHTML = "";

                return;

            }


            quizBox.innerHTML =

                currentQuiz
                    .map(function(item, index) {

                        const options =
                            item.options || [];


                        return `
                            <div
                                class="card quiz-question"
                                style="margin-bottom:20px;">

                                <h3>
                                    ${index + 1}.
                                    ${escapeHTML(
                                        item.question
                                    )}
                                </h3>


                                <div
                                    style="
                                        margin-top:15px;
                                        display:grid;
                                        gap:10px;
                                    ">

                                    ${options
                                        .map(
                                            function(
                                                option,
                                                optionIndex
                                            ) {

                                                return `
                                                    <button
                                                        class="quiz-option"
                                                        onclick="
                                                            selectAnswer(
                                                                ${index},
                                                                ${optionIndex},
                                                                this
                                                            )
                                                        "
                                                        style="
                                                            text-align:left;
                                                            padding:14px;
                                                            border:1px solid #dbe3ef;
                                                            background:white;
                                                            border-radius:12px;
                                                        ">

                                                        ${escapeHTML(
                                                            option
                                                        )}

                                                    </button>
                                                `;

                                            }
                                        )
                                        .join("")}

                                </div>

                            </div>
                        `;

                    })
                    .join("") +

                `
                    <button
                        class="primary"
                        onclick="finishQuiz()">

                        Finish Quiz

                    </button>

                    <div
                        id="quizScore"
                        style="margin-top:20px;">
                    </div>
                `;

        }


        /* =========================
           SELECT ANSWER
        ========================= */

        function selectAnswer(
    questionIndex,
    optionIndex,
    button
) {

    selectedAnswers[questionIndex] =
        optionIndex;

    const questionBox =
        button.closest(".quiz-question");

    questionBox
        .querySelectorAll(".quiz-option")
        .forEach(function(btn) {

            btn.style.background = "white";
            btn.style.color = "#172033";
            btn.style.borderColor = "#dbe3ef";

        });

    button.style.background = "#2563eb";
    button.style.color = "white";
    button.style.borderColor = "#2563eb";
}


/* =========================
   FINISH QUIZ
========================= */

function finishQuiz() {

    const scoreBox =
        document.getElementById("quizScore");

    if (!currentQuiz.length) {
        return;
    }

    let score = 0;

    currentQuiz.forEach(
        function(item, index) {

            const selected =
                selectedAnswers[index];

            const correct =
                Number(item.answer);

            if (
                selected !== null &&
                selected === correct
            ) {
                score++;
            }

        }
    );

    const total =
        currentQuiz.length;

    const percentage =
        Math.round(
            (score / total) * 100
        );


    /* SAVE PROGRESS */

    progressData.quizzes++;

    progressData.questions += total;

    progressData.score += percentage;

    localStorage.setItem(
        "KRON_PROGRESS",
        JSON.stringify(progressData)
    );


    scoreBox.innerHTML = `
        <div class="card">

            <h2>
                Quiz Complete
            </h2>

            <div
                style="
                    font-size:42px;
                    font-weight:800;
                    color:#2563eb;
                    margin:15px 0;
                ">

                ${score} / ${total}

            </div>

            <p>
                Score: ${percentage}%
            </p>

        </div>
    `;


    currentQuiz.forEach(
        function(item, index) {

            const questionBox =
                document.querySelectorAll(
                    ".quiz-question"
                )[index];

            if (!questionBox) {
                return;
            }

            const explanation =
                item.explanation ||
                "No explanation provided.";

            const selected =
                selectedAnswers[index];

            const correct =
                Number(item.answer);

            const feedback =
                document.createElement("div");

            feedback.className = "card";

            feedback.style.marginTop =
                "15px";

            feedback.innerHTML = `
                <strong>
                    ${
                        selected !== null &&
                        selected === correct
                            ? "Correct"
                            : "Incorrect"
                    }
                </strong>

                <p style="margin-top:8px;">
                    ${escapeHTML(explanation)}
                </p>
            `;

            questionBox.appendChild(
                feedback
            );

        }
    );


    saveChat(
        "WAEC Quiz",
        "Completed " +
        total +
        " questions",
        "Score: " +
        score +
        "/" +
        total +
        " (" +
        percentage +
        "%)"
    );

    renderProgress();
}


/* =========================
   NOTES
========================= */

function saveNote() {

    const title =
        document.getElementById(
            "noteTitle"
        ).value.trim();

    const content =
        document.getElementById(
            "noteContent"
        ).value.trim();

    if (!title || !content) {

        alert(
            "Please enter a title and note."
        );

        return;
    }

    notes.unshift({

        id: Date.now(),

        title: title,

        content: content,

        date:
            new Date()
            .toLocaleDateString()

    });

    localStorage.setItem(
        "KRON_NOTES",
        JSON.stringify(notes)
    );

    document.getElementById(
        "noteTitle"
    ).value = "";

    document.getElementById(
        "noteContent"
    ).value = "";

    renderNotes();

    renderProgress();
}


/* =========================
   RENDER NOTES
========================= */

function renderNotes() {

    const box =
        document.getElementById(
            "notesList"
        );

    if (!box) {
        return;
    }

    if (!notes.length) {

        box.innerHTML = `
            <div class="card">

                <h3>
                    No notes yet
                </h3>

                <p>
                    Your saved revision notes
                    will appear here.
                </p>

            </div>
        `;

        return;
    }

    box.innerHTML =
        notes.map(function(note) {

            return `
                <div
                    class="card"
                    style="margin-bottom:15px;">

                    <h3>
                        ${escapeHTML(
                            note.title
                        )}
                    </h3>

                    <p
                        style="
                            margin-top:10px;
                            white-space:pre-wrap;
                        ">

                        ${escapeHTML(
                            note.content
                        )}

                    </p>

                    <p
                        style="
                            margin-top:10px;
                            font-size:13px;
                        ">

                        Saved:
                        ${escapeHTML(
                            note.date
                        )}

                    </p>

                    <button
                        class="secondary"
                        style="margin-top:12px;"
                        onclick="
                            deleteNote(
                                ${note.id}
                            )
                        ">

                        Delete

                    </button>

                </div>
            `;

        }).join("");
}


function deleteNote(id) {

    notes =
        notes.filter(
            function(note) {

                return note.id !== id;

            }
        );

    localStorage.setItem(
        "KRON_NOTES",
        JSON.stringify(notes)
    );

    renderNotes();

    renderProgress();
                  }
      /* =========================
   PLANNER
========================= */

function addPlannerTask() {

    const task =
        document.getElementById(
            "plannerTask"
        ).value.trim();

    const subject =
        document.getElementById(
            "plannerSubject"
        ).value;

    if (!task) {

        alert(
            "Enter a study task first."
        );

        return;
    }

    plannerTasks.push({

        id: Date.now(),

        task: task,

        subject: subject,

        completed: false

    });

    localStorage.setItem(
        "KRON_PLANNER",
        JSON.stringify(
            plannerTasks
        )
    );

    document.getElementById(
        "plannerTask"
    ).value = "";

    renderPlanner();
}


function renderPlanner() {

    const box =
        document.getElementById(
            "plannerList"
        );

    if (!box) {
        return;
    }

    if (!plannerTasks.length) {

        box.innerHTML = `
            <div class="card">

                <h3>
                    No study tasks yet
                </h3>

                <p>
                    Add your first study task above.
                </p>

            </div>
        `;

        return;
    }

    box.innerHTML =
        plannerTasks.map(function(item) {

            return `
                <div
                    class="card"
                    style="margin-bottom:15px;">

                    <h3>
                        ${escapeHTML(
                            item.task
                        )}
                    </h3>

                    <p>
                        Subject:
                        ${escapeHTML(
                            item.subject
                        )}
                    </p>

                    <button
                        class="primary"
                        onclick="
                            togglePlannerTask(
                                ${item.id}
                            )
                        ">

                        ${
                            item.completed
                                ? "Mark Incomplete"
                                : "Mark Complete"
                        }

                    </button>

                    <button
                        class="secondary"
                        onclick="
                            deletePlannerTask(
                                ${item.id}
                            )
                        ">

                        Delete

                    </button>

                </div>
            `;

        }).join("");
}


function togglePlannerTask(id) {

    plannerTasks =
        plannerTasks.map(
            function(item) {

                if (item.id === id) {

                    item.completed =
                        !item.completed;

                }

                return item;

            }
        );

    localStorage.setItem(
        "KRON_PLANNER",
        JSON.stringify(
            plannerTasks
        )
    );

    renderPlanner();
}


function deletePlannerTask(id) {

    plannerTasks =
        plannerTasks.filter(
            function(item) {

                return item.id !== id;

            }
        );

    localStorage.setItem(
        "KRON_PLANNER",
        JSON.stringify(
            plannerTasks
        )
    );

    renderPlanner();
}


/* =========================
   PROGRESS
========================= */

function renderProgress() {

    const quizzes =
        document.getElementById(
            "progressQuizzes"
        );

    const questions =
        document.getElementById(
            "progressQuestions"
        );

    const average =
        document.getElementById(
            "progressAverage"
        );

    const noteCount =
        document.getElementById(
            "progressNotes"
        );

    const summary =
        document.getElementById(
            "progressSummary"
        );

    if (!quizzes) {
        return;
    }

    quizzes.textContent =
        progressData.quizzes;

    questions.textContent =
        progressData.questions;

    noteCount.textContent =
        notes.length;

    if (progressData.quizzes > 0) {

        average.textContent =
            Math.round(
                progressData.score /
                progressData.quizzes
            ) + "%";

    } else {

        average.textContent =
            "0%";

    }

    if (progressData.quizzes === 0) {

        summary.textContent =
            "Start your first quiz to begin building your study progress.";

    } else {

        summary.textContent =
            "You have completed " +
            progressData.quizzes +
            " quiz" +
            (
                progressData.quizzes === 1
                    ? ""
                    : "zes"
            ) +
            " and answered " +
            progressData.questions +
            " questions.";

    }
}


/* =========================
   INITIAL LOAD
========================= */

renderNotes();

renderPlanner();

renderProgress();

renderChatHistory();

</script>
